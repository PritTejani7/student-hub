<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <section class="form-card">
            <h1>Student Registration</h1>

            <p class="subtitle">
                Please enter your details carefully.
            </p>

            <form id="registrationForm" novalidate>

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                    <small id="nameError" class="error"></small>

                </div>

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        autocomplete="email"
                        required
                    >

                    <small id="emailError" class="error"></small>

                </div>

                <div class="form-group">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="Enter 10 digit mobile number"
                        maxlength="10"
                        inputmode="numeric"
                        autocomplete="tel"
                        required
                    >

                    <small id="mobileError" class="error"></small>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="new-password"
                        required
                    >

                    <div class="strength-container">

                        <div
                            id="strengthBar"
                            class="strength-bar">
                        </div>

                    </div>

                    <small
                        id="strengthText"
                        class="strength-text">
                    </small>

                    <small
                        id="passwordError"
                        class="error">
                    </small>

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter password"
                        autocomplete="new-password"
                        required
                    >

                    <small
                        id="confirmPasswordError"
                        class="error">
                    </small>

                </div>

                <div class="form-group">

                    <label for="course">
                        Course
                    </label>

                    <select id="course" name="course" required>

                        <option value="">
                            -- Select Course --
                        </option>

                        <option value="BCA">
                            BCA
                        </option>

                        <option value="BBA">
                            BBA
                        </option>

                        <option value="B.Tech">
                            B.Tech
                        </option>

                        <option value="MCA">
                            MCA
                        </option>

                    </select>

                    <small
                        id="courseError"
                        class="error">
                    </small>

                </div>

                <div class="form-group">

                    <label for="year">
                        Year
                    </label>

                    <select id="year" name="year" required>

                        <option value="">
                            -- Select Year --
                        </option>

                        <option value="1">
                            First Year
                        </option>

                        <option value="2">
                            Second Year
                        </option>

                        <option value="3">
                            Third Year
                        </option>

                        <option value="4">
                            Fourth Year
                        </option>

                    </select>

                    <small
                        id="yearError"
                        class="error">
                    </small>

                </div>

                <fieldset>

                    <legend>Gender</legend>
                    <div class="gender-options">

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Male"
                            >
                            Male
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Female"
                            >
                            Female
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Other"
                            >
                            Other
                        </label>

                    </div>

                    <small
                        id="genderError"
                        class="error">
                    </small>

                </fieldset>

                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                        >

                        I agree to the
                        <span>Terms and Conditions</span>

                    </label>

                    <small
                        id="termsError"
                        class="error">
                    </small>

                </div>

                <div class="buttons">

                    <button
                        type="submit"
                        id="submitButton">
                        Register
                    </button>

                    <button
                        type="reset"
                        id="resetButton">
                        Clear
                    </button>

                </div>

                <div
                    id="successMessage"
                    class="success"
                    role="alert">
                </div>

            </form>
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
